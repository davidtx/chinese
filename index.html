<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="page-title">Chinese Character Tracing</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- 屏幕一：输入页 -->
  <section id="screen-input" class="screen active">
    <div class="card">
      <div class="card-header">
        <span class="lang-toggle-spacer" aria-hidden="true"></span>
        <h1 id="app-title">Chinese Character Tracing</h1>
        <button id="lang-toggle-input" class="lang-toggle" type="button">中文</button>
      </div>
      <p class="hint" id="app-subtitle">Enter Chinese characters to trace them one by one</p>
      <textarea id="input-text" placeholder="e.g. 春眠不觉晓" rows="2"></textarea>
      <p id="input-error" class="error-msg"></p>
      <button id="btn-start" class="btn btn-primary">Start</button>
      <button id="btn-goto-picker" class="btn btn-secondary">Choose Characters</button>
      <button id="btn-goto-history" class="btn btn-secondary">History</button>
    </div>
  </section>

  <!-- 屏幕二：描红练习页 -->
  <section id="screen-practice" class="screen">
    <div class="practice-header">
      <button id="btn-back-input" class="btn-icon" title="Back">←</button>
      <div id="practice-progress" class="progress-text">1 / 1</div>
      <div class="header-controls">
        <label class="hint-toggle">
          <span id="hint-label">Hint</span>
          <input type="checkbox" id="hint-toggle-input">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
        <button id="lang-toggle" class="lang-toggle" type="button">中文</button>
        <button id="btn-speak" class="speak-btn" type="button" title="Play pronunciation">🔊</button>
      </div>
      <div id="practice-mistakes" class="mistakes-text"></div>
    </div>

    <div id="pinyin-display" class="pinyin-display"></div>

    <div class="char-box-wrapper">
      <div id="char-box" class="char-box">
        <div id="character-target"></div>
      </div>
    </div>

    <div class="practice-footer">
      <button id="btn-clear" class="btn btn-secondary">Clear</button>
      <button id="btn-next" class="btn btn-primary">Next</button>
    </div>
  </section>

  <!-- 屏幕三：汇总展示页 -->
  <section id="screen-summary" class="screen">
    <div class="summary-header">
      <h2 id="summary-title">Practice Results</h2>
      <div id="summary-text" class="summary-text"></div>
      <div id="summary-score" class="summary-score"></div>
    </div>
    <div id="summary-grid" class="summary-grid"></div>
    <div class="summary-footer">
      <button id="btn-restart" class="btn btn-primary">Practice Again</button>
    </div>
  </section>

  <!-- 屏幕四：历史记录页 -->
  <section id="screen-history" class="screen">
    <div class="history-header">
      <button id="btn-back-input-2" class="btn-icon" title="Back">←</button>
      <h2 id="history-title">History</h2>
    </div>
    <div id="history-list" class="history-list"></div>
  </section>

  <!-- 屏幕五：选字练习页 -->
  <section id="screen-picker" class="screen">
    <div class="history-header">
      <button id="btn-back-input-3" class="btn-icon" title="Back">←</button>
      <h2 id="picker-title">Choose Characters</h2>
    </div>
    <div id="grade-tabs" class="grade-tabs"></div>
    <div id="group-list" class="group-list"></div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.min.js"></script>
<script src="js/characterData.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
